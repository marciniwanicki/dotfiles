# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Use Catppuccin Mocha palette
palette = "catppuccin_mocha"

# Inserts a blank line between shell prompts
add_newline = true

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)" # for vi mode if you use it

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[directory]
truncation_length = 0       # don’t cut off after N segments
truncate_to_repo = false    # don’t stop at the repo root
fish_style_pwd_dir_length = 0  # don’t shorten each segment

[git_branch]
style = "green"

[git_status]
style = "yellow"
format = '[$all_status$ahead_behind](yellow) '
stashed = " $count stashed "
behind = "󰜮 behind by $count commit(s) "
ahead = "󰜷 ahead by $count commit(s) "
diverged = "󰜷 ahead by $ahead_count, 󰜮 behind by $behind_count commit(s) "
untracked = " $count untracked file(s) "
modified = " $count modified file(s) "
staged = " $count staged file(s) "
renamed = "󰑕 $count renamed file(s) "
deleted = " $count deleted file(s) "

[status]
style = "bold red"
symbol = "✘ "
disabled = false

# Language modules - clean text style
[swift]
format = "[(\\($symbol$version\\))]($style) "
symbol = "swift "
style = "overlay0"

